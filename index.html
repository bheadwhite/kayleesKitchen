<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- `viewport-fit=cover` lets the fixed header and nav footer run under the
         notch and the home indicator; they pay the insets back themselves with
         env(safe-area-inset-*). Without it iOS letterboxes the installed app. -->
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f3" />
    <meta name="description" content="Kitchen Help — a shared family recipe box." />
    <!-- iOS decides standalone from its own tags, not the manifest's `display`. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kitchen Help" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The manifest link and the service-worker registration are injected by
         vite-plugin-pwa at build time; see vite.config.ts. -->
    <title>Kitchen Help</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
